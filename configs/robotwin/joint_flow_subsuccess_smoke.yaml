seed: 42
device: cuda
precision: fp32
output_dir: outputs/robotwin_subsuccess_smoke_joint_flow

data:
  windows_dir: data/prepared/robotwin_subsuccess_smoke_v0
  episodes_dir: data/episodes/robotwin_subsuccess_smoke_v0
  features_dir: data/features/robotwin_subsuccess_smoke_dinov2_vitb14_224
  prompt_features: data/prompts/robotwin_subsuccess_smoke_mock32/prompt_features.npz
  prompt_feature_dim: 32
  norm_stats: data/prepared/robotwin_subsuccess_smoke_v0/norm_stats.json
  history: 4
  horizon: 8
  stride: 2
  batch_size: 16
  split_by: episode
  mock_features: false
  num_stages: 5
  action_dim: 30
  proprio_dim: 30

features:
  encoder: vit_base_patch14_dinov2.lvd142m
  image_size: 224
  feature_dim: 768

action:
  representation: robotwin_next_step_absolute_proprio_proxy_zscore
  mode: absolute
  convert_absolute_to_delta: false
  normalize: true

model:
  name: lightweight_joint_flow_dit_robotwin_subsuccess_smoke
  hidden_dim: 64
  transformer_layers: 1
  transformer_heads: 4
  dropout: 0.0
  mlp_ratio: 2
  phi_tokens: 5
  phi_target_mode: delta_trajectory

score:
  denoise_steps: 1
  train_denoise_steps: 1
  phi_reduce: last
  future_obs_init: zero

loss:
  obs_weight: 1.0
  action_weight: 1.0
  phi_weight: 5.0
  critic_flow_weight: 0.5
  counterfactual_weight: 0.05
  margin: 0.02

negatives:
  simple_per_positive: 1
  train_types: ["zero", "reverse", "shuffle", "scaled_0.25", "scaled_1.75"]
  types: ["zero", "reverse", "shuffle", "scaled"]
  scaled_values: [0.25, 1.75]

eval:
  negative_types: "zero,reverse,shuffle,scaled_0.25,scaled_1.75"

optim:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 0.0
  grad_clip_norm: 1.0

train:
  max_epochs: 1
  eval_every: 1
  save_best_by: val/delta_phi_mae
  action_condition_prob: 0.75
  cf_negatives_per_batch: 2
